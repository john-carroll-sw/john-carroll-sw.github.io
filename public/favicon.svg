<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="John Carroll">
  <defs>
    <linearGradient id="plate" x1="10" y1="8" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07111d"/>
      <stop offset="0.58" stop-color="#071827"/>
      <stop offset="1" stop-color="#050912"/>
    </linearGradient>
    <linearGradient id="accent" x1="11" y1="12" x2="53" y2="53" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feColorMatrix
        in="blur"
        type="matrix"
        values="0 0 0 0 0.25 0 0 0 0 0.91 0 0 0 0 0.98 0 0 0 0.55 0"
        result="cyanBlur"
      />
      <feMerge>
        <feMergeNode in="cyanBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="5" y="5" width="54" height="54" rx="13" fill="url(#plate)"/>
  <rect x="6.5" y="6.5" width="51" height="51" rx="11.5" fill="none" stroke="#67e8f9" stroke-opacity="0.28" stroke-width="3"/>
  <path d="M14 15H50" stroke="url(#accent)" stroke-width="3.5" stroke-linecap="square" opacity="0.86"/>
  <path d="M14 49H50" stroke="#67e8f9" stroke-width="2" stroke-linecap="square" opacity="0.24"/>
  <text
    x="31.5"
    y="42"
    text-anchor="middle"
    font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="27"
    font-weight="800"
    letter-spacing="-1.8"
    fill="#f8fafc"
    filter="url(#glow)"
  >JC</text>
</svg>
